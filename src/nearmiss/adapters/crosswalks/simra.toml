# SPDX-License-Identifier: Apache-2.0
# Declarative field crosswalk: SimRa (TU Berlin, simra-project/dataset) -> nearmiss intake enums.
#
# SimRa's incident codes are Close pass, pulling in/out, near left hook, near
# right hook, head-on, tailgating, near-dooring, dodging an obstacle, other
# (documented as an ordinal 1-9 in the dataset export). Where our closed
# hazard_type vocabulary cannot represent the distinction, the mapping falls
# back to "other" rather than overstate the conflict — the same
# "honesty over precision we don't have" rule as the BikeMaps crosswalk (see
# docs/REAL-DATA.md). This manifest is validated at load time (see
# src/nearmiss/adapters/base.py:load_crosswalk) against the enums in
# schema/report.schema.json.

[source]
id = "simra"
name = "SimRa (TU Berlin)"
url = "https://github.com/simra-project/dataset"
# Verified 2026-08-07 against simra-project/dataset README: the licence is CC BY-NC
# 4.0, NOT CC BY 4.0 as this field previously claimed. The NonCommercial clause is
# load-bearing -- it is not an Open Definition licence, and a published dataset that
# merges SimRa reports inherits the restriction. TU Berlin additionally grants
# journalistic use "as if it were a non-commercial use", and all use is subject to
# the repository's separate terms of use. Re-check before any commercial deployment
# or before merging SimRa into a dataset published under different terms.
license = "SimRa dataset (TU Berlin); CC BY-NC 4.0 <https://creativecommons.org/licenses/by-nc/4.0/>, plus an explicit additional grant for journalistic use; subject to the terms of use in the simra-project/dataset repository."
# Issue #186. The NonCommercial clause was recorded here and the conclusion drawn in
# docs/DATA-CARD.md ("No SimRa-derived data is currently published from this
# repository"), but nothing at the adapter level said so -- the framework shipped a
# source it had already decided it cannot publish from, and only a reader of all three
# of DATA-CARD.md, REAL-DATA.md and this file could see it. The same NonCommercial
# reasoning is what docs/REAL-DATA.md uses to refuse a SeeClickFix adapter, so applying
# it to a registered source is consistency, not a new position.
publication_status = "research_only"
publication_note = "CC BY-NC 4.0. The NonCommercial clause survives aggregation, so a dataset merging SimRa reports is not distributable under Apache-2.0 alone. Local and research analysis is fine; publishing derived data from this repository is not, unless and until the project takes a written position on whether aggregate statistics over CC BY-NC records constitute redistribution."
bias_label = "app-recruited cyclists in a handful of instrumented regions, near-miss-only"

# --- bias profile ------------------------------------------------------------
# Every axis in adapters/base.py:BIAS_AXES must be answered, in this source's own
# terms; load_crosswalk() rejects a missing, blank, or placeholder answer. See
# docs/DATA-CARD.md ("Known reporting biases") for what each axis means. SimRa's
# skew is meaningfully different from BikeMaps', which is the whole point of
# keeping these profiles per-source rather than averaging them together.
[source.bias_profile]
# Where reports land vs. where people actually ride.
route_choice = "Incidents are recorded only along routes SimRa participants actually rode, so this is a map of participants' commutes. A street no participant uses generates no incidents regardless of how hazardous it is."
# Who files a report at all.
reporter_pool = "Reporters are cyclists who installed the SimRa app, usually via a university or advocacy-group recruitment drive, which skews toward tech-comfortable, already-engaged riders rather than a representative cross-section of who bikes. Non-cyclists are wholly absent."
# Device, connectivity, and awareness needed to report.
app_access = "Participation needs a modern smartphone with usable sensors, enough battery tolerance to run a recording app for a whole ride, and a data plan. That is a materially higher bar than a one-off web form, and it excludes riders on older or borrowed devices."
# Which languages the reporting form actually serves.
language = "The app and its recruitment materials are German-first with limited English, so riders who read neither are excluded from participating at all. This is a recruitment-stage exclusion rather than a per-report one, and it cannot be corrected after the fact."
# Race, income, tenure, age skew of the reporter pool.
demographic_skew = "Recruitment ran through universities and cycling advocacy groups in mostly affluent European cities, so participants skew younger, more educated, and higher-income than the general cycling population, and migrant and working-class riders are under-represented."
# The streets nobody rides produce no data.
survivorship = "A segment participants consider too dangerous to ride never appears in a trace at all, so the most hostile infrastructure can be entirely invisible in this source rather than showing up as a hotspot."
# Dramatic events get reported; chronic ones do not.
salience = "Automatic detection favours abrupt, sensor-visible events such as hard braking or swerving. A close pass that a confident rider absorbs smoothly without a sudden motion may go undetected, so the data over-weights startling incidents. SimRa also records near-misses only, with no injury outcome at all."
# Campaigns and news coverage create spikes.
temporal_campaign = "Coverage exists only where a research partner ran a time-boxed collection campaign, mostly Berlin plus a handful of other regions, so both the geography and the date range are artefacts of funding cycles. A segment with zero reports may simply sit outside any campaign, not be safe."

# --- hazard_type -------------------------------------------------------------
# SimRa's numeric incident code -> our closed hazard_type enum
# {close_pass, dooring, surface_hazard, sightline, signal, debris, other}.
[hazard_type]
default = "other"

[[hazard_type.rules]]
when = "1"
value = "close_pass"
rationale = "SimRa code 1 (Close pass) is exactly our close_pass definition."

[[hazard_type.rules]]
when = "7"
value = "dooring"
rationale = "SimRa code 7 (near-dooring) is the door-zone conflict."

[[hazard_type.rules]]
when = "8"
value = "surface_hazard"
rationale = "SimRa code 8 (dodging an obstacle) is closest to a surface/path hazard the rider swerved around."

# Codes 2-6 and 9 (pulling in/out, near left/right hook, head-on, tailgating,
# other) are real conflicts but not specifically a close pass, dooring, or
# surface hazard; we do not have a generic "vehicle conflict" type, so they
# stay honestly "other" via the default.

# --- severity ------------------------------------------------------------
# SimRa records near-crashes only — there is no injury/outcome field at all, so
# every mapped report is unconditionally "near_miss" (no rules needed; the
# adapter never calls severity_from for this source, but the default documents
# the contract for anyone reading the manifest).
[severity]
default = "near_miss"
