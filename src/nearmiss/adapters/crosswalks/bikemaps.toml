# SPDX-License-Identifier: Apache-2.0
# Declarative field crosswalk: BikeMaps.org -> nearmiss intake enums.
#
# Derived from SPARLab/BikeMaps mapApp/models/incident.py (INCIDENT_WITH_CHOICES,
# INJURY_CHOICES). Where BikeMaps draws a distinction our closed hazard_type
# vocabulary cannot represent, the mapping falls back to "other" rather than
# overstate the conflict — honesty over precision we don't have (see
# docs/REAL-DATA.md). This manifest is validated at load time (see
# src/nearmiss/adapters/base.py:load_crosswalk) against the enums in
# schema/report.schema.json, so a typo here fails fast rather than surfacing as
# a rejected report deep in a pipeline run.

[source]
id = "bikemaps"
name = "BikeMaps.org"
url = "https://bikemaps.org"
license = "BikeMaps.org public data; see https://bikemaps.org/terms for reuse terms."
# Issue #186. docs/DATA-CARD.md asserted "CC BY 4.0 / permitted with attribution" for
# this source while this manifest -- the machine-readable record it is supposed to
# render -- said only "see bikemaps.org/terms". Nothing in this repository establishes
# redistribution rights for BikeMaps records, so the honest status is `undetermined`,
# not `publishable`. Reading bikemaps.org/terms and reducing it to a citable statement
# (with the retrieval date, the way the SimRa row was corrected on 2026-08-07) is what
# moves this. Until then no BikeMaps-derived data may be published from here.
#
# Separately, and independent of the licence: the live BikeMaps extract measured on
# 2026-08-04 (docs/REAL-DATA.md) held 6,222 reports worldwide, of which 0 fell inside
# the `davis` bbox and 1 inside `sacramento`. Coverage, not adapter count, is the
# binding constraint on a real-data path here.
publication_status = "undetermined"
publication_note = "Nothing in this repository establishes redistribution rights for BikeMaps records: the source's own terms page is cited but has not been read into a citable statement here, and no SPDX identifier is claimed for it. Treat as not publishable until it is."
bias_label = "self-selected app-user cyclists, skewed toward confident/regular riders"

# --- bias profile ------------------------------------------------------------
# Every axis in adapters/base.py:BIAS_AXES must be answered, in this source's own
# terms; load_crosswalk() rejects a missing, blank, or placeholder answer. The
# axis list mirrors the named biases in docs/DATA-CARD.md ("Known reporting
# biases"). An axis that genuinely does not apply must still say WHY, because
# "n/a" is exactly the non-answer this check exists to reject.
[source.bias_profile]
# Where reports land vs. where people actually ride.
route_choice = "Reports trace the routes confident cyclists already choose, so a street with no reports may be empty of reports because riders avoid it entirely, not because it is safe. The routes people refuse to ride produce zero reports and therefore look perfect."
# Who files a report at all.
reporter_pool = "Reporters are cyclists who know BikeMaps.org exists and choose to file; this under-represents casual, new, and fearful riders. Pedestrians, wheelchair users, and scooter riders are essentially absent because BikeMaps is a cycling-specific tool, so this source alone cannot speak to non-cyclist road-user risk."
# Device, connectivity, and awareness needed to report.
app_access = "Filing requires a smartphone or a web browser plus the awareness that the site exists, so lower-income and less-connected riders are under-counted even where their risk is higher. There is no phone-in or paper channel to offset it."
# Which languages the reporting form actually serves.
language = "The BikeMaps form is English-first, so riders who do not read English are under-represented; a segment through a predominantly non-English-speaking neighbourhood may be under-reported for language reasons alone rather than being safer."
# Race, income, tenure, age skew of the reporter pool.
demographic_skew = "The cycling-advocacy pool BikeMaps recruits from skews whiter, more male, higher-income, and more middle-aged than the population that actually cycles, so report density partly tracks advocacy presence rather than hazard density."
# The streets nobody rides produce no data.
survivorship = "A segment with few reports may be one almost nobody will ride. Low report volume is never read as safety here, which is why the pipeline publishes 'exposure unknown' rather than a flattering rate when the denominator is missing."
# Dramatic events get reported; chronic ones do not.
salience = "A frightening close pass at speed is far more likely to be filed than a chronic, mundane hazard such as a persistently bad surface, so the hazard-type mix over-weights dramatic vehicle conflicts and under-weights slow-burn infrastructure problems."
# Campaigns and news coverage create spikes.
temporal_campaign = "Reports cluster around local promotion: BikeMaps' home city, Victoria BC, is by far the densest, and a local campaign, news story, or serious crash produces a reporting spike that reflects attention rather than any change in danger."

# --- hazard_type -------------------------------------------------------------
# BikeMaps' `incident_with` free choice -> our closed hazard_type enum
# {close_pass, dooring, surface_hazard, sightline, signal, debris, other}.
[hazard_type]
default = "other"

[[hazard_type.rules]]
when = "Vehicle, passing"
value = "close_pass"
rationale = "A motor vehicle passing too closely is exactly our close_pass definition."

[[hazard_type.rules]]
when = "Vehicle, open door"
value = "dooring"
rationale = "Direct match: the door-zone conflict with an opening vehicle door."

[[hazard_type.rules]]
when = "Pothole"
value = "surface_hazard"
rationale = "Pavement defect."

[[hazard_type.rules]]
when = "Curb"
value = "surface_hazard"
rationale = "Physical surface obstruction in the path, same bucket as a pothole."

[[hazard_type.rules]]
when = "Train Tracks"
value = "surface_hazard"
rationale = "A rideable-surface hazard (wheel-catching tracks), not a sightline or signal problem."

[[hazard_type.rules]]
when = "Lane divider"
value = "surface_hazard"
rationale = "Physical infrastructure obstruction in the path."

[[hazard_type.rules]]
when = "Roadway"
value = "surface_hazard"
rationale = "Generic road-surface defect category."

[[hazard_type.rules]]
when = "Sign/Post"
value = "sightline"
rationale = "A fixed obstruction most often implicated as a visibility/sightline problem, not a surface defect underfoot."

# Any other motor-vehicle conflict (head on, side, angle, rear end, turning) is a
# real car conflict but not specifically a close pass or dooring; we do not have a
# generic "vehicle collision" type, so it stays honestly "other" via the default.

# --- severity ------------------------------------------------------------
# BikeMaps' `injury` text (collisions endpoint only) -> our closed severity enum
# {near_miss, minor, serious}. Matches are case-insensitive substrings against
# the injury field; nearmiss/hazard endpoints never reach this rule set because
# the adapter assigns their severity directly (see adapters/bikemaps.py).
[severity]
default = "minor"  # a collision (this rule set only applies to the collisions endpoint) always involved contact, so the floor is "minor"

[[severity.rules]]
contains = "hospital"
value = "serious"
rationale = "Hospitalization is the closest BikeMaps signal to a serious-injury outcome."
