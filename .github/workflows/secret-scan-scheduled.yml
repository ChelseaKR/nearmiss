# SPDX-License-Identifier: Apache-2.0
# Scheduled, full-history secret scan (SEC-19), reporting on all three of TruffleHog's result
# tiers — a revoked credential is `unverified`, not `verified`, so the verified-only scan this
# used to be could not fail on the very case it exists for. This is deliberately separate from
# the per-PR `gitleaks` step in ci.yml: gitleaks runs the incremental diff on every push/PR (fast
# feedback), while this job re-scans the ENTIRE committed history on a schedule with a second tool
# (TruffleHog) that verifies credentials against their issuing service before flagging them — so a
# secret that slipped in before gitleaks' ruleset caught that pattern, or a gitleaks false-negative,
# still gets caught, and a false-positive noise problem doesn't drown out real findings.
#
# Added in the 2026-07-05 remediation pass.
# NOTE: like every workflow here, this only runs once committed and pushed to GitHub.

name: Scheduled secret scan (full history, all result tiers)

on:
  schedule:
    # Weekly, Monday 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trufflehog:
    name: TruffleHog (full-history, all result tiers, blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # On a `schedule` trigger the action scans the full history of the checked-out ref (no
      # base/head diff), per its own event-type handling.
      #
      # Two lanes, because the tier and the detector set cannot be widened in one step
      # without losing something. See `docs/adr` reasoning inline:
      #
      # LANE 1 (below) reports every result tier — including `unverified`, which is what
      # a REVOKED credential looks like — with the three detectors that only ever match
      # this repository's own test fixtures switched off.
      #
      # LANE 2 (further down) is the gate exactly as it stood before: verified results
      # only, with every detector except Lob still enabled. It exists so that turning URI
      # and Postgres off in lane 1 cannot silently drop verified-credential coverage for
      # those two detectors. Together the two lanes are a strict superset of what this
      # job checked before.
      - name: TruffleHog OSS — full history, all result tiers
        # The ref and the `version:` input below must name the SAME release, and
        # tests/test_trufflehog_workflow.py fails the build when they do not. They had
        # drifted: the ref said v3.97.1 while the scanner downloaded 3.96.0, because
        # Dependabot rewrites `uses:` and never a `with:` input, so three "upgrades"
        # were no-ops that read like upgrades.
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b  # v3.97.1
        with:
          path: ./
          # Pinned. The action's `version` input defaults to "latest" and it runs
          # `ghcr.io/trufflesecurity/trufflehog:${VERSION}`, so SHA-pinning the action
          # above does not pin what actually scans. That is how this gate changed
          # behaviour with no commit here: upstream published 3.96.0 and the next
          # run picked it up.
          version: "3.97.1"
          # `--results=verified,unknown,unverified` is load-bearing; the old
          # `--results=verified` could not fail on the case this job exists for.
          # TruffleHog sorts a finding into three tiers: `verified` (it authenticated
          # the credential against the live service), `unknown` (verification errored
          # out), and `unverified` (it asked, and the service said no). A credential
          # that leaked and was then REVOKED — the normal end state of a real leak,
          # and precisely what a scheduled full-history sweep is for — answers "no",
          # so it lands in `unverified`. Measured 2026-09-06 on a throwaway clone of
          # this repository, with a real-shaped AWS key planted in one commit and
          # deleted in the next (confirmed present in history and absent at HEAD
          # before each run):
          #
          #   --results=verified                     exit 0,   0 reported
          #   --results=verified,unknown,unverified  exit 183, unverified_secrets: 1
          #
          # `--only-verified` is the same hole under a different name, and so is
          # `--results=verified,unknown`.
          #
          # URI and Postgres are excluded from THIS lane only, and only because the
          # widened tier surfaced exactly three findings across the whole history
          # (9,158 chunks, 14 MB), every one of them a committed test fixture built
          # from RFC 2606 reserved names:
          #
          #   tests/test_ingestion.py    https://token:super-secret@example.test
          #   tests/test_ingestion.py    postgres://operator:secret@example.test:5432
          #   tests/test_fars_adapter.py https://user:secret@static.nhtsa.gov
          #
          # The first two are the fixtures for the "a failure receipt must not leak
          # the exception text" test; the third is the fixture for the FARS adapter's
          # URL-redaction test. They are in history as well as at HEAD, so no edit at
          # HEAD can retire them. Excluded by detector name rather than by path, per
          # this repository's existing reasoning below and the portfolio precedent in
          # olive-bark-logger/ledger: fixtures are where a real credential is most
          # likely to land by accident, so `tests/` must stay in scope. Lane 2 keeps
          # both detectors armed for verified results.
          #
          # Lob is excluded because 3.96.0's Lob detector pattern,
          # `\b((live|test)_[a-zA-Z0-9_]{35})\b`, matches any identifier starting
          # `test_` with exactly 35 word characters after it, which is an ordinary
          # pytest function name. Its verifier then POSTs to api.lob.com and reads the
          # 403 as proof of a live key with no billing attached, so matches are
          # promoted to verified. There is no Lob integration in this repo. Scoped to
          # the one detector rather than excluding tests/ by path, because fixtures are
          # where a real credential is most likely to land by accident. Same reasoning
          # as gtfs-scorecard ADR 0044.
          extra_args: --results=verified,unknown,unverified --exclude-detectors=Lob,URI,Postgres

      # LANE 2 — the gate exactly as it stood before this change: verified results only,
      # every detector except Lob still enabled. Its only job is to make lane 1's URI and
      # Postgres exclusions safe: a *live* Postgres DSN or credentialed URI anywhere in
      # this history still fails the build here. It reports nothing today (0 findings,
      # measured at 3.97.1), which is what makes it cheap to keep.
      #
      # `if: !cancelled()` so a failure in lane 1 does not hide lane 2's findings: one run
      # reports everything it can see rather than only the first thing that broke.
      - name: TruffleHog OSS — full history, verified only, every detector but Lob
        if: ${{ !cancelled() }}
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b  # v3.97.1
        with:
          path: ./
          version: "3.97.1"
          extra_args: --results=verified --exclude-detectors=Lob
