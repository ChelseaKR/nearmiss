# SPDX-License-Identifier: Apache-2.0
# nearmiss release — dispatched build, SBOM, keyless-signing, SLSA provenance,
# and Trusted Publishing (FIX-11: docs/ideation/02-large-scale-fixes.md).
#
# Turns the claims in README.md ("signed releases") and
# docs/standards/SECURITY-AND-SUPPLY-CHAIN-STANDARD.md §6 / RELEASE-AND-VERSIONING-STANDARD.md §4
# from prose into a mechanism: dispatching this workflow from `main` with an existing signed
# `vX.Y.Z` tag builds the sdist/wheel, generates a CycloneDX SBOM, signs every release artifact AND
# every published city GeoJSON with Sigstore (keyless, OIDC — no long-lived key), attaches SLSA build
# provenance, cuts a GitHub Release carrying all of it, and publishes to PyPI via Trusted Publishing
# (OIDC, no stored API token).
#
# WHY DISPATCH, NOT `push: tags`. This used to fire on `push: tags: v*`, which made
# `git push origin v0.5.0` — one command, no confirmation — upload to PyPI unattended. PyPI does not
# allow a version to be re-uploaded, so a tag pushed by mistake, or at the wrong commit, could not be
# taken back; `nearmiss-safety` 0.3.0, 0.3.1 and 0.4.0 all reached PyPI that way. Dispatch splits
# tagging from publishing: the tag push is now inert, and releasing is a separate deliberate act that
# additionally waits on the `pypi` environment's required reviewer.
#
# This is also what docs/standards/RELEASE-AND-VERSIONING-STANDARD.md §4 has prescribed all along —
# "the maintainer dispatches the release workflow from the default branch and supplies that tag as an
# input", because "a tag-push workflow executes the workflow definition stored at the tagged ref,
# while the release authority must come from the reviewed workflow on trusted `main`". The trigger
# now matches the standard the repository committed to.
#
# The `verify-tag` job below is the trust boundary and runs before anything else: nothing is built,
# signed, released or uploaded from a tag that is not an annotated tag object, signed by a key in the
# committed .github/allowed_signers, and reachable from origin/main.
#
# NOTE: PyPI Trusted Publishing is already registered for this repo (project `nearmiss-safety`,
# workflow `release.yml`, environment `pypi`) and working. Keep the `environment: pypi` declaration on
# publish-pypi in step with that registration — removing it would send a claim PyPI no longer expects.
#
# See docs/DATA-CARD.md "How to verify a release" for the consumer-facing verification commands this
# workflow's signing stage exists to make possible.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed stable SemVer tag (vX.Y.Z) to release"
        required: true
        type: string

# Least privilege by default; each job widens only what it needs (SLSA build-isolation rule —
# SECURITY-AND-SUPPLY-CHAIN-STANDARD.md §6.4).
permissions:
  contents: read

# Two releases of the same tag can never publish at once. Keyed on the tag input rather than
# `github.ref`: every dispatch now runs from `refs/heads/main`, so a ref key would serialise
# unrelated releases into one queue instead of guarding a single tag.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  PYTHONHASHSEED: "0"

jobs:
  # The trust boundary. Ported verbatim from ctdl-validate's publish path
  # (.github/verify-release-tag.sh + .github/allowed_signers, byte-identical) rather than written
  # fresh here, so there is one implementation of "is this a tag the maintainer signed" across the
  # portfolio instead of several that drift.
  #
  # The script owns checks 1-4 (a tag was actually resolved; the grandfather list may only name
  # literal tags; annotated tag object; signature verifies against the committed allowed-signers
  # file). Its check 5, "the tag names the commit this run is building", does not apply to a dispatch
  # from `main` — the run is building main's head, and the tag may legitimately name an earlier commit
  # on main — so EXPECT_COMMIT is empty and the two steps around the script carry the equivalent
  # guarantees that RELEASE-AND-VERSIONING-STANDARD.md §4 "0. trust" names: the dispatch ref is main,
  # and the tag's commit is reachable from origin/main. Downstream jobs then build the commit this job
  # resolved, not a second resolution of the same name.
  #
  # GRANDFATHERED_TAGS is empty: v0.2.0, v0.3.0, v0.3.1 and v0.4.0 are all annotated tags that verify
  # against this allowed_signers today, so no release is exempt.
  verify-tag:
    name: verify-tag (the release tag is one the maintainer signed)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Full history and tags: the tag object being verified has to be present
          # locally for `git verify-tag` to read its signature, and the ancestry
          # check below needs main's history.
          fetch-depth: 0
          persist-credentials: false

      - name: The dispatch came from main
        # Release authority comes from the reviewed workflow on trusted main. A dispatch from any
        # other ref runs a workflow definition that was never reviewed on main.
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::release must be dispatched from main, not ${GITHUB_REF}."
            exit 1
          fi

      - name: The release tag is signed by a key this repository trusts
        id: verify
        env:
          # Routed through env: rather than interpolated into the run: shell. A tag name is
          # dispatch input and carries no guarantee about shell metacharacters.
          RELEASE_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          # Empty on purpose — see this job's comment.
          EXPECT_COMMIT: ""
          ALLOWED_SIGNERS: .github/allowed_signers
          GRANDFATHERED_TAGS: ""
        run: bash .github/verify-release-tag.sh

      - name: The tag names a commit on main
        # Without this, a signed tag cut on a side branch — never reviewed, never merged — would
        # release. The signature proves who made the tag, not that the code passed review.
        env:
          RELEASE_COMMIT: ${{ steps.verify.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${RELEASE_COMMIT}" origin/main; then
            echo "::error::${RELEASE_COMMIT} is not reachable from origin/main. Release tags are cut on main only."
            exit 1
          fi

  release:
    name: build, verify, SBOM, sign, attest, GitHub Release
    needs: [verify-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The verified tag, used everywhere this job previously read GITHUB_REF_NAME. On a dispatch
      # GITHUB_REF_NAME is "main"; the release identity has to come from the job that checked it.
      RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # OIDC — cosign keyless signing (Fulcio/Rekor)
      attestations: write # SLSA build provenance
    # Caching is disabled everywhere in this job (no `cache: pip`, no actions/cache) — a build/sign
    # job is exactly where cache poisoning would defeat SLSA isolation (SECURITY-AND-SUPPLY-CHAIN
    # §6.4; CI-CD-STANDARD.md).
    steps:
      - name: Checkout the exact tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the verified tag names. On a dispatch the default checkout is main's head,
          # which is the tagged commit only by coincidence; this builds what the tag selected.
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install gettext (msgfmt — needed by 'make verify' -> i18n gate)
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Install the dev toolchain (hashed, --require-hashes)
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Version consistency — tag == pyproject.toml == installed __version__
        # RELEASE-AND-VERSIONING-STANDARD.md §2/§4 stage 1: the release job re-derives the version
        # three independent ways and fails the release rather than publish a mismatched artifact.
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          PYPROJECT_VERSION="$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          INSTALLED_VERSION="$(python -c "import nearmiss; print(nearmiss.__version__)")"
          echo "tag=$TAG_VERSION pyproject=$PYPROJECT_VERSION installed=$INSTALLED_VERSION"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ] || [ "$TAG_VERSION" != "$INSTALLED_VERSION" ]; then
            echo "::error::version mismatch — tag ($TAG_VERSION), pyproject.toml ($PYPROJECT_VERSION), and the installed package (${INSTALLED_VERSION}) must all agree. Bump pyproject.toml's [project] version and re-tag."
            exit 1
          fi

      - name: CHANGELOG has a dated entry for this version
        # RELEASE-AND-VERSIONING-STANDARD.md §3.2: AUTO-GATE on presence (no empty releases). The
        # entry's CONTENT — including the intake-schema and dataset-schema subsections this project's
        # CHANGELOG convention requires per release — is human-curated (REVIEW-GATE on quality); this
        # step only refuses to release a version nobody wrote up.
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          if ! grep -qE "^## \[${TAG_VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${TAG_VERSION}]' section. Add the release entry (with its Intake report schema / Published dataset schema subsections) before tagging."
            exit 1
          fi

      - name: Re-run the full merge gate at the tagged commit
        # Stage 2 of the standard pipeline: never trust the PR's green checkmark — main can drift
        # after a PR merges and before a tag is cut.
        run: make verify

      - name: Install the release build front-end
        # `build` (PyPA's PEP 517 front-end) is intentionally NOT in requirements-dev.lock: like the
        # `mutation` extra, it never touches the audited pip-audit/merge-gate surface (pyproject.toml
        # `[project.optional-dependencies].release`). Installed on demand, here only.
        run: python -m pip install "build>=1.2"

      - name: Assert the wheel test actually ran
        # tests/test_packaged_schema.py's wheel test needs PyPI's `build`, and the step
        # above is the first thing anywhere to install it: `make verify` ran at the top
        # of this job without it, and ci.yml never installs it at all, so the test
        # skipped in every environment that exists. NEARMISS_REQUIRE_BUILD=1 turns that
        # skip into a failure, making this the one place the wheel contract is checked.
        # tests/test_release_workflow.py holds this step in place.
        env:
          NEARMISS_REQUIRE_BUILD: "1"
        run: python -m pytest tests/test_packaged_schema.py -q

      - name: Build the sdist + wheel (reproducible, deterministic)
        run: make release-build

      - name: Smoke the built wheel in a clean environment
        # Building, signing and attesting an artifact says nothing about
        # whether the installed thing runs. 0.3.0 passed every gate above and
        # then raised on first use because the wheel shipped no
        # schema/report.schema.json. Install it somewhere else and run it.
        run: |
          set -euo pipefail
          python -m venv /tmp/release-smoke
          /tmp/release-smoke/bin/python -m pip install --quiet --upgrade pip
          /tmp/release-smoke/bin/python -m pip install --quiet dist/*.whl
          cd /
          /tmp/release-smoke/bin/python -c "import nearmiss, nearmiss.validation as v; p = v.find_report_schema(); assert p.is_file(), p; print('resolved', p)"
          /tmp/release-smoke/bin/nearmiss --help > /dev/null

      - name: Generate a CycloneDX 1.7 SBOM for the release artifacts
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sigstore-sign the sdist, wheel, SBOM, and every published city GeoJSON
        # Keyless cosign: the workflow's own OIDC identity is exchanged for a short-lived Fulcio
        # signing cert, and the signature is logged to the public Rekor transparency log — no
        # long-lived private key exists to steal (SECURITY-AND-SUPPLY-CHAIN §6.4). `--bundle` writes
        # the modern single-file Sigstore bundle (signature + cert + Rekor inclusion proof) that
        # `cosign verify-blob --bundle` expects — cosign's split `--output-signature`/
        # `--output-certificate` flags are the older, pre-bundle form. Signing the published GeoJSON
        # alongside the Python package is unusual (SBOM/Sigstore are normally scoped to code
        # artifacts) — deliberate here because `data/published/*.geojson` IS this project's other
        # release artifact; see the "Excellent looks like" bar in docs/ideation/02-large-scale-fixes.md
        # FIX-11 and the verification steps in docs/DATA-CARD.md.
        run: |
          set -euo pipefail
          shopt -s nullglob
          targets=(dist/*.whl dist/*.tar.gz sbom.cdx.json data/published/*.geojson)
          for f in "${targets[@]}"; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
          printf '%s\n' "${targets[@]}" > signed-artifacts.txt

      - name: SLSA build provenance (dist artifacts + published GeoJSON)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            data/published/*.geojson

      - name: Extract this release's CHANGELOG section (used as the GitHub Release body)
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          awk -v ver="$TAG_VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create the GitHub Release (attaches dist, SBOM, signatures, certs, provenance)
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$ATTESTATION_BUNDLE_PATH"
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.md \
            dist/*.whl dist/*.tar.gz \
            sbom.cdx.json ./*.sigstore.json dist/*.sigstore.json data/published/*.sigstore.json \
            "$ATTESTATION_BUNDLE_PATH"

  publish-pypi:
    name: publish to PyPI (Trusted Publishing, OIDC)
    needs: [verify-tag, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The irreversible step, and the only one in this workflow that cannot be undone: PyPI does not
    # allow a version to be re-uploaded. `pypi` carries a required reviewer, so this job waits for a
    # human even with every gate above it green. The url is what the approval prompt shows them.
    # CI-CD-STANDARD §environments — and note that `environment:` is only a gate while the
    # environment exists AND has a protection rule; the name alone gates nothing.
    environment:
      name: pypi
      url: https://pypi.org/p/nearmiss-safety
    permissions:
      id-token: write # OIDC — the ONLY publish credential; no stored PYPI_API_TOKEN
    steps:
      - name: Checkout the exact tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The same commit verify-tag resolved and the release job built.
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the release build front-end
        run: python -m pip install "build>=1.2"

      - name: Rebuild the sdist + wheel (this job's own filesystem — no cross-job artifact reuse)
        run: make release-build

      - name: Publish to PyPI via Trusted Publishing
        # No API token anywhere in this repo's secrets: `pypa/gh-action-pypi-publish` exchanges this
        # job's OIDC token for a short-lived PyPI upload credential, scoped to exactly this
        # repo+workflow+environment (RELEASE-AND-VERSIONING-STANDARD §5.1). REQUIRES a one-time
        # manual step first: register this repo as a Trusted Publisher for the `nearmiss` PyPI
        # project (see the NOTE at the top of this file). Until that is done, this job fails here —
        # harmlessly: the signed GitHub Release from the `release` job above is unaffected.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
